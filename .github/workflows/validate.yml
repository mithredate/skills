name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code && (python3 -c "import yaml" || pip3 install --quiet --break-system-packages pyyaml)

      - name: Validate marketplace and plugins
        run: ./scripts/validate.sh
