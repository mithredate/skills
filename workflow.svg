<svg xmlns="http://www.w3.org/2000/svg" width="760" height="730" viewBox="0 0 760 730">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .bg { fill: #f6f8fa; stroke: #d0d7de; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .you { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .t { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .s { fill: #59636e; font-size: 13px; }
    .h { fill: #0550ae; font-size: 13px; font-weight: 600; }
    .ln { fill: none; stroke: #8c959f; stroke-width: 1.5; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #161b22; stroke: #30363d; }
      .box { fill: #0d1117; stroke: #3d444d; }
      .you { fill: #121d2f; stroke: #4493f8; }
      .t { fill: #f0f6fc; }
      .s { fill: #9198a1; }
      .h { fill: #79c0ff; }
      .ln { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="head" d="M1 1.5 L9 5 L1 8.5 Z"/>
    </marker>
  </defs>

  <rect class="bg" x="1" y="1" width="758" height="728" rx="16"/>

  <rect class="you" x="53" y="28" width="170" height="40" rx="20"/>
  <text class="h" x="138" y="53">you: a request</text>
  <rect class="you" x="353" y="28" width="170" height="40" rx="20"/>
  <text class="h" x="438" y="53">you: a big idea</text>

  <path class="ln" d="M138 68 V104" marker-end="url(#arrow)"/>
  <path class="ln" d="M438 68 V104" marker-end="url(#arrow)"/>

  <rect class="box" x="53" y="104" width="170" height="64" rx="12"/>
  <text class="t" x="138" y="141">prep</text>

  <rect class="box" x="338" y="104" width="200" height="64" rx="12"/>
  <text class="t" x="438" y="131">orchestrate</text>
  <text class="h" x="438" y="154">you approve each brief</text>

  <path class="ln" d="M138 168 V194 H438 V168"/>
  <path class="ln" d="M288 194 V220" marker-end="url(#arrow)"/>

  <rect class="box" x="173" y="220" width="230" height="80" rx="12"/>
  <text class="t" x="288" y="246">settle-decisions</text>
  <text class="s" x="288" y="268">decides the rest</text>
  <text class="h" x="288" y="288">asks you the critical ones</text>

  <path class="ln" d="M288 300 V330" marker-end="url(#arrow)"/>

  <rect class="box" x="228" y="330" width="120" height="40" rx="12"/>
  <text class="t" x="288" y="355">brief</text>

  <path class="ln" d="M288 370 V404" marker-end="url(#arrow)"/>

  <rect class="box" x="228" y="404" width="120" height="40" rx="12"/>
  <text class="t" x="288" y="429">fire</text>

  <path class="ln" d="M348 424 H468" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect class="box" x="468" y="396" width="240" height="56" rx="12"/>
  <text class="t" x="588" y="419">implementer and reviewers</text>
  <text class="s" x="588" y="440">up to 3 rounds</text>

  <path class="ln" d="M288 444 V492" marker-end="url(#arrow)"/>

  <rect class="box" x="228" y="492" width="120" height="40" rx="12"/>
  <text class="t" x="288" y="517">draft PR</text>

  <rect class="box" x="468" y="484" width="240" height="56" rx="12"/>
  <text class="t" x="588" y="507">evals</text>
  <text class="s" x="588" y="528">past PRs score the reviewer</text>

  <path class="ln" d="M588 484 V452" marker-end="url(#arrow)"/>

  <path class="ln" d="M288 532 V572" marker-end="url(#arrow)"/>

  <rect class="box" x="148" y="572" width="280" height="62" rx="12"/>
  <text class="t" x="288" y="598">merge-judge</text>
  <text class="s" x="288" y="620">auto only when no critical item applies</text>

  <path class="ln" d="M428 603 H468" marker-end="url(#arrow)"/>

  <rect class="box" x="468" y="583" width="120" height="40" rx="12"/>
  <text class="t" x="528" y="608">merged</text>

  <path class="ln" d="M288 634 V682 H468" marker-end="url(#arrow)"/>

  <rect class="you" x="468" y="662" width="140" height="40" rx="20"/>
  <text class="h" x="538" y="687">you review</text>
</svg>
