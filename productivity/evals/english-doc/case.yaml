schema_version: "1.1"
name: english-doc
tags: [writing]
execution:
  timeout_seconds: 600
  allowed_tools: [Skill, Read]
  prompt: |
    Call the Skill tool with `productivity:write-ste`, and then with `productivity:unslop`. Check the text between the two lines below with both skills. It is a text that people read. Do not rewrite it.

    ---
    ## 🚀 Getting Started With The Sync Tool

    Experts believe the tool boasts numerous features. It may terminate the session; the user should then initiate a new one.

    **Performance:** Performance improved after the change. In the event that the cache is cold → reload and/or restart.

    Config file lists scripts. The plugin leverages the cache to facilitate fast reads and ensures “safe” writes. It could potentially be argued that this paradigm is our north star.

    The future looks bright. Certainly!
    ---

    Reply with the findings only. Write one finding per line, in this format: `quoted words || skill || rule`. The skill is `write-ste` or `unslop`. For `unslop`, the rule is the rule number. For `write-ste`, the rule is a few words of the rule. List every hit, and do not filter by importance. If a skill tells you to write something more in your answer, write it on a line that starts with `NOTE:`.
graders:
  - name: loads-write-ste
    type: tool_used
    tool: Skill
    input_match: 'write-ste'
  - name: loads-unslop
    type: tool_used
    tool: Skill
    input_match: 'unslop'
  - name: ste-may
    type: regex
    pattern: '\bmay\b[^\n]*write-ste'
  - name: ste-should
    type: regex
    pattern: 'should[^\n]*write-ste'
  - name: ste-terminate
    type: regex
    pattern: 'terminate[^\n]*write-ste'
  - name: ste-initiate
    type: regex
    pattern: 'initiate[^\n]*write-ste'
  - name: ste-leverage
    type: regex
    pattern: 'leverage[^\n]*write-ste'
  - name: ste-facilitate
    type: regex
    pattern: 'facilitate[^\n]*write-ste'
  - name: ste-ensure
    type: regex
    pattern: 'ensure[^\n]*write-ste'
  - name: ste-semicolon
    type: regex
    pattern: ';[^\n]*write-ste'
  - name: ste-arrow
    type: regex
    pattern: '(→|arrow)[^\n]*write-ste'
  - name: ste-slash
    type: regex
    pattern: 'and/or[^\n]*write-ste'
  - name: ste-article
    type: regex
    pattern: 'Config file[^\n]*write-ste'
  - name: unslop-5-vague-attribution
    type: regex
    pattern: 'Experts believe[^\n]*unslop[^\n]*\b5\b'
  - name: unslop-8-boasts
    type: regex
    pattern: 'boasts[^\n]*unslop[^\n]*\b8\b'
  - name: unslop-16-inline-header
    type: regex
    pattern: 'Performance[^\n]*unslop[^\n]*\b16\b'
  - name: unslop-17-title-case
    type: regex
    pattern: 'Getting Started[^\n]*unslop[^\n]*\b17\b'
  - name: unslop-18-emoji
    type: regex
    pattern: '(🚀|emoji)[^\n]*unslop[^\n]*\b18\b'
  - name: unslop-19-quote-marks
    type: regex
    pattern: '(“|”|safe)[^\n]*unslop[^\n]*\b19\b'
  - name: unslop-20-chatbot-phrase
    type: regex
    pattern: 'Certainly[^\n]*unslop[^\n]*\b20\b'
  - name: unslop-24-hedging
    type: regex
    pattern: 'potentially[^\n]*unslop[^\n]*\b24\b'
  - name: unslop-25-generic-conclusion
    type: regex
    pattern: 'future looks bright[^\n]*unslop[^\n]*\b25\b'
  - name: unslop-26-paradigm
    type: regex
    pattern: 'paradigm[^\n]*unslop[^\n]*\b26\b'
  - name: unslop-26-north-star
    type: regex
    pattern: 'north star[^\n]*unslop[^\n]*\b26\b'
  - name: unslop-31-numerous
    type: regex
    pattern: 'numerous[^\n]*unslop[^\n]*\b31\b'
  - name: unslop-31-in-the-event-that
    type: regex
    pattern: '[Ii]n the event that[^\n]*unslop[^\n]*\b31\b'
