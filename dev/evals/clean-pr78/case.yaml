schema_version: "1.1"
name: clean-pr78
context:
  scaffold_script: scaffold.sh
execution:
  timeout_seconds: 1800
  allowed_tools: [Agent, Read, Grep, Glob]
  prompt: |
    Start the `dev:pr-reviewer` agent with the Agent tool. Give it the prompt between the two lines below. Replace `<workdir>` with the absolute path of your working directory.

    ---
    Review one change.

    - Diff file: `<workdir>/pr.diff`
    - Brief file: `<workdir>/brief.md`. It holds the PR title, and the brief or the PR body. Read it whole.
    - Repo root: `<workdir>/repo`, at the head commit of the change.
    - Repo rules: `AGENTS.md` at the repo root.

    Return your structured finding list.
    ---

    When the agent returns, reply with its JSON exactly as it returned it. Write nothing else.
graders:
  - name: no-blocking-or-discrepancy
    type: regex
    pattern: '^(?=[\s\S]*"blocking"\s*:\s*\[\s*\])(?=[\s\S]*"discrepancy"\s*:\s*\[\s*\])'
  - name: reviewer-ran
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"dev:pr-reviewer"'
