schema_version: "1.1"
name: recall-watch-discussions-timeout
context:
  scaffold_script: scaffold.sh
execution:
  timeout_seconds: 1800
  allowed_tools: [Agent, Read, Grep, Glob]
  prompt: |
    Start the `dev:pr-reviewer` agent with the Agent tool. Give it the prompt between the two lines below. Replace `<workdir>` with the absolute path of your working directory.

    ---
    Review one change.

    - Diff file: `<workdir>/pr.diff`
    - Brief file: `<workdir>/brief.md`. It holds the PR title, and the brief or the PR body. Read it whole.
    - Repo root: `<workdir>/repo`, at the head commit of the change.
    - Repo rules: `AGENTS.md` at the repo root.

    Return your structured finding list.
    ---

    When the agent returns, reply with its JSON exactly as it returned it. Write nothing else.
graders:
  - name: finds-the-class
    type: llm
    criteria: |
      The reply holds the JSON finding list of a code reviewer. Judge only the entries of its `blocking`, `discrepancy`, and `quality_note` arrays. An entry can be a string or an object. Ignore all other keys and arrays, such as `nit` and `pre_existing`.

      The bug class: a connector call with no timeout blocks its caller. In `watch-discussions/hooks/register.ts`, `$.mcp.call` has no time limit, so a hung connector call holds back the code that waits for it.

      The instances:
      - The timer callback runs `checkThreads` before the PR refresh (`watch-discussions/hooks/register.ts:180`). A hung connector call in `checkThreads` holds back the PR refresh.
      - `fetchReplies` calls `$.mcp.call` with no timeout. The `tool.call` hook and the `/watch-discussions` command wait for it through `addThread`, so a hung call holds back the main loop or the command.

      PASS if one entry names the bug class. An entry names the class when it states that a connector call has no timeout and that a hung call blocks the code that waits for it.
      PASS if the entries together name every instance. An entry names an instance when it points at the same caller and the same missing timeout.
      FAIL in every other case. FAIL also if the reply holds no finding list.
