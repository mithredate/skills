schema_version: "1.1"
name: recall-manage-agents-md-symlink
context:
  scaffold_script: scaffold.sh
execution:
  timeout_seconds: 1800
  allowed_tools: [Agent, Read, Grep, Glob]
  prompt: |
    Start the `dev:pr-reviewer` agent with the Agent tool. Give it the prompt between the two lines below. Replace `<workdir>` with the absolute path of your working directory.

    ---
    Review one change.

    - Diff file: `<workdir>/pr.diff`
    - Brief file: `<workdir>/brief.md`. It holds the PR title, and the brief or the PR body. Read it whole.
    - Repo root: `<workdir>/repo`, at the head commit of the change.
    - Repo rules: `AGENTS.md` at the repo root.

    Return your structured finding list.
    ---

    When the agent returns, reply with its JSON exactly as it returned it. Write nothing else.
graders:
  - name: finds-the-class
    type: llm
    criteria: |
      The reply holds the JSON finding list of a code reviewer. Judge only its `blocking` and `discrepancy` entries. An entry can be a string or an object. A `quality_note` entry does not count.

      PASS if one entry says, as a defect, that step 1 can leave a Claude-only line in `AGENTS.md`, because step 1 moves only the lines that `AGENTS.md` does not hold yet. The main example is a symlinked `AGENTS.md`. Step 1 replaces it with a copy of `CLAUDE.md`, the copy holds every line, and no Claude-only line gets to `.claude/rules/claude-code.md`.

      FAIL otherwise.
